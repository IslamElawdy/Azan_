<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>isAzan – Einstellungen</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #1e1b4b, #312e81 45%, #0f172a);
      color: #f8fafc;
      padding: 16px;
      padding-bottom: 88px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px; }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    input, select {
      width: 100%;
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(15,23,42,0.85);
      color: #fff;
      margin-bottom: 12px;
    }
    .row2 { display: flex; gap: 10px; }
    .row2 > div { flex: 1; }
    .toggles label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: #f1f5f9;
      font-size: 1rem;
    }
    .toggles input { width: auto; margin: 0; }
    .offsets { display: flex; flex-wrap: wrap; gap: 8px; }
    .offsets label { width: calc(50% - 4px); margin: 0; }
    .offsets input { margin-bottom: 0; }
    .status {
      font-size: 0.85rem;
      color: #86efac;
      min-height: 1.2em;
    }
    .save-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 12px 16px;
      background: rgba(15,23,42,0.95);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    button {
      width: 100%;
      font-size: 1.05rem;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <h1>isAzan</h1>
  <p class="sub">Einstellungen für den Samsung-TV (im gleichen WLAN)</p>
  <p id="status" class="status"></p>

  <div class="card">
    <label for="city">Stadt</label>
    <select id="city">
      <option value="berlin">Berlin</option>
      <option value="munich">München</option>
      <option value="hamburg">Hamburg</option>
      <option value="custom">Manuell</option>
    </select>
    <div class="row2">
      <div>
        <label for="latitude">Breite</label>
        <input id="latitude" type="number" step="0.0001">
      </div>
      <div>
        <label for="longitude">Länge</label>
        <input id="longitude" type="number" step="0.0001">
      </div>
    </div>
    <label for="timezone">Zeitzone</label>
    <input id="timezone" type="text">
    <label for="method">Berechnungsmethode</label>
    <select id="method">
      <option value="Turkey">Turkey / Diyanet</option>
      <option value="MuslimWorldLeague">Muslim World League</option>
      <option value="Egyptian">Egyptian</option>
      <option value="Karachi">Karachi</option>
      <option value="UmmAlQura">Umm Al-Qura</option>
      <option value="NorthAmerica">ISNA</option>
      <option value="Singapore">Singapore</option>
    </select>
    <label for="madhab">Asr-Madhhab</label>
    <select id="madhab">
      <option value="Shafi">Standard</option>
      <option value="Hanafi">Hanafi</option>
    </select>
  </div>

  <div class="card">
    <label for="audio">Azan-Audio</label>
    <select id="audio">
      <option value="abdulbasit">Abdul Basit</option>
      <option value="egypt">Adhan Egypt</option>
      <option value="makkah">Makkah</option>
      <option value="madinah">Madinah</option>
    </select>
    <label for="volume">Lautstärke</label>
    <input id="volume" type="number" min="0" max="100">
  </div>

  <div class="card toggles">
    <strong>Gebete aktiv</strong>
    <label><input type="checkbox" id="toggle-fajr"> Fajr</label>
    <label><input type="checkbox" id="toggle-dhuhr"> Dhuhr</label>
    <label><input type="checkbox" id="toggle-asr"> Asr</label>
    <label><input type="checkbox" id="toggle-maghrib"> Maghrib</label>
    <label><input type="checkbox" id="toggle-isha"> Isha</label>
  </div>

  <div class="card offsets">
    <label>Fajr <input id="offset-fajr" type="number"></label>
    <label>Dhuhr <input id="offset-dhuhr" type="number"></label>
    <label>Asr <input id="offset-asr" type="number"></label>
    <label>Maghrib <input id="offset-maghrib" type="number"></label>
    <label>Isha <input id="offset-isha" type="number"></label>
  </div>

  <div class="save-bar">
    <button id="save-btn" type="button">Speichern &amp; an TV senden</button>
  </div>

  <script>
    var PRESETS = {
      berlin: { latitude: 52.52, longitude: 13.405, timezone: 'Europe/Berlin' },
      munich: { latitude: 48.1351, longitude: 11.582, timezone: 'Europe/Berlin' },
      hamburg: { latitude: 53.5511, longitude: 9.9937, timezone: 'Europe/Berlin' }
    };
    var PRAYERS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
    var statusEl = document.getElementById('status');
    var saveBtn = document.getElementById('save-btn');

    function setStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.style.color = ok === false ? '#fca5a5' : '#86efac';
    }

    function readForm() {
      var enabled = {};
      PRAYERS.forEach(function (k) {
        enabled[k] = document.getElementById('toggle-' + k).checked;
      });
      var offsets = {};
      PRAYERS.forEach(function (k) {
        offsets[k] = parseInt(document.getElementById('offset-' + k).value, 10) || 0;
      });
      return {
        city: document.getElementById('city').value,
        latitude: parseFloat(document.getElementById('latitude').value),
        longitude: parseFloat(document.getElementById('longitude').value),
        timezone: document.getElementById('timezone').value.trim(),
        calculationMethod: document.getElementById('method').value,
        madhab: document.getElementById('madhab').value,
        audioVariant: document.getElementById('audio').value,
        volume: parseInt(document.getElementById('volume').value, 10) || 80,
        enabledPrayers: enabled,
        offsets: offsets
      };
    }

    function fillForm(data) {
      document.getElementById('city').value = data.city || 'berlin';
      document.getElementById('latitude').value = data.latitude;
      document.getElementById('longitude').value = data.longitude;
      document.getElementById('timezone').value = data.timezone || 'Europe/Berlin';
      document.getElementById('method').value = data.calculationMethod || 'Turkey';
      document.getElementById('madhab').value = data.madhab || 'Shafi';
      document.getElementById('audio').value = data.audioVariant || 'abdulbasit';
      document.getElementById('volume').value = data.volume || 80;
      PRAYERS.forEach(function (k) {
        document.getElementById('toggle-' + k).checked = data.enabledPrayers[k] !== false;
        document.getElementById('offset-' + k).value = (data.offsets && data.offsets[k]) || 0;
      });
    }

    document.getElementById('city').addEventListener('change', function () {
      var p = PRESETS[this.value];
      if (p) {
        document.getElementById('latitude').value = p.latitude;
        document.getElementById('longitude').value = p.longitude;
        document.getElementById('timezone').value = p.timezone;
      }
    });

    saveBtn.addEventListener('click', function () {
      saveBtn.disabled = true;
      setStatus('Speichere…');
      fetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(readForm())
      }).then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) {
            setStatus('Gespeichert (v' + res.settingsVersion + '). TV synchronisiert beim nächsten Abruf.');
          } else {
            setStatus(res.error || 'Fehler', false);
          }
        })
        .catch(function (e) { setStatus(e.message, false); })
        .then(function () { saveBtn.disabled = false; });
    });

    fetch('/api/settings')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        fillForm(data);
        setStatus('Verbunden. Version ' + (data.settingsVersion || 1));
      })
      .catch(function (e) { setStatus('Laden fehlgeschlagen: ' + e.message, false); });
  </script>
</body>
</html>
