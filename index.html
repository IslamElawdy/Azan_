<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>AzanTV</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1 class="app-title">AzanTV</h1>
            <p id="header-status" class="header-status">Initialisiere…</p>
        </header>

        <main id="screen-main" class="screen screen-active">
            <section class="panel panel-clock">
                <p class="label">Aktuelle Uhrzeit</p>
                <p id="main-current-time" class="value-large">--:--:--</p>
            </section>
            <section class="panel panel-next">
                <p class="label">Nächstes Gebet</p>
                <p id="main-next-prayer" class="value-medium">—</p>
                <p id="main-countdown" class="value-small">Countdown: —</p>
            </section>
            <section class="panel panel-times">
                <p class="label">Heutige Gebetszeiten</p>
                <ul id="main-prayer-list" class="prayer-list"></ul>
            </section>
            <section class="panel panel-status">
                <p class="label">Alarm-Status</p>
                <p id="main-alarm-status" class="value-small">—</p>
            </section>
            <nav class="main-nav">
                <button id="btn-open-settings" class="nav-btn focusable" tabindex="0">Einstellungen</button>
                <button id="btn-test-30s" class="nav-btn focusable" tabindex="0">Test: Azan in 30 s</button>
                <button id="btn-test-1min" class="nav-btn focusable" tabindex="0">Test: Alarm in 1 min</button>
            </nav>
        </main>

        <main id="screen-settings" class="screen">
            <h2 class="screen-title">Einstellungen</h2>
            <div class="settings-grid">
                <label class="setting-row focusable" tabindex="0">
                    <span>Stadt</span>
                    <select id="setting-city" class="setting-input">
                        <option value="berlin">Berlin</option>
                        <option value="munich">München</option>
                        <option value="hamburg">Hamburg</option>
                        <option value="custom">Manuell</option>
                    </select>
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Breitengrad</span>
                    <input id="setting-latitude" type="number" step="0.0001" class="setting-input" value="52.52">
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Längengrad</span>
                    <input id="setting-longitude" type="number" step="0.0001" class="setting-input" value="13.405">
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Zeitzone</span>
                    <input id="setting-timezone" type="text" class="setting-input" value="Europe/Berlin">
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Berechnungsmethode</span>
                    <select id="setting-method" class="setting-input">
                        <option value="MuslimWorldLeague">Muslim World League</option>
                        <option value="Egyptian">Egyptian</option>
                        <option value="Karachi">Karachi</option>
                        <option value="UmmAlQura">Umm Al-Qura (Makkah)</option>
                        <option value="NorthAmerica">ISNA / North America</option>
                        <option value="Turkey">Turkey / Diyanet</option>
                        <option value="Singapore">Singapore</option>
                    </select>
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Asr-Madhhab</span>
                    <select id="setting-madhab" class="setting-input">
                        <option value="Shafi">Standard (Shafi/Maliki/Hanbali)</option>
                        <option value="Hanafi">Hanafi</option>
                    </select>
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Azan-Audio</span>
                    <select id="setting-audio" class="setting-input">
                        <option value="makkah">Makkah</option>
                        <option value="madinah">Madinah</option>
                    </select>
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Fajr-Audio</span>
                    <select id="setting-fajr-audio" class="setting-input">
                        <option value="same">Wie Standard</option>
                        <option value="fajr">Separates Fajr-Audio</option>
                    </select>
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Lautstärke (0–100)</span>
                    <input id="setting-volume" type="number" min="0" max="100" class="setting-input" value="80">
                </label>
                <label class="setting-row focusable" tabindex="0">
                    <span>Wartezeit nach Azan (s)</span>
                    <input id="setting-exit-delay" type="number" min="0" max="120" class="setting-input" value="10">
                </label>
                <fieldset class="setting-fieldset">
                    <legend>Gebete aktiv</legend>
                    <label class="toggle-row focusable" tabindex="0"><input id="toggle-fajr" type="checkbox" checked> Fajr</label>
                    <label class="toggle-row focusable" tabindex="0"><input id="toggle-dhuhr" type="checkbox" checked> Dhuhr</label>
                    <label class="toggle-row focusable" tabindex="0"><input id="toggle-asr" type="checkbox" checked> Asr</label>
                    <label class="toggle-row focusable" tabindex="0"><input id="toggle-maghrib" type="checkbox" checked> Maghrib</label>
                    <label class="toggle-row focusable" tabindex="0"><input id="toggle-isha" type="checkbox" checked> Isha</label>
                </fieldset>
                <fieldset class="setting-fieldset">
                    <legend>Zeit-Offsets (Minuten)</legend>
                    <label class="offset-row focusable" tabindex="0">Fajr <input id="offset-fajr" type="number" class="setting-input offset-input" value="0"></label>
                    <label class="offset-row focusable" tabindex="0">Dhuhr <input id="offset-dhuhr" type="number" class="setting-input offset-input" value="0"></label>
                    <label class="offset-row focusable" tabindex="0">Asr <input id="offset-asr" type="number" class="setting-input offset-input" value="0"></label>
                    <label class="offset-row focusable" tabindex="0">Maghrib <input id="offset-maghrib" type="number" class="setting-input offset-input" value="0"></label>
                    <label class="offset-row focusable" tabindex="0">Isha <input id="offset-isha" type="number" class="setting-input offset-input" value="0"></label>
                </fieldset>
            </div>
            <nav class="settings-nav">
                <button id="btn-save-settings" class="nav-btn focusable" tabindex="0">Speichern &amp; neu planen</button>
                <button id="btn-test-azan" class="nav-btn focusable" tabindex="0">Azan jetzt testen</button>
                <button id="btn-back-main" class="nav-btn focusable" tabindex="0">Zurück</button>
            </nav>
        </main>

        <main id="screen-prayer" class="screen screen-prayer">
            <p class="prayer-label">Gebetszeit</p>
            <h2 id="prayer-name" class="prayer-name">—</h2>
            <p id="prayer-time" class="prayer-time">--:--</p>
            <p id="prayer-status" class="prayer-status">Azan wird vorbereitet…</p>
        </main>
    </div>

    <script src="src/vendor/adhan.min.js"></script>
    <script src="src/storageService.js"></script>
    <script src="src/prayerTimeService.js"></script>
    <script src="src/alarmService.js"></script>
    <script src="src/audioService.js"></script>
    <script src="src/tvPowerService.js"></script>
    <script src="src/testModeService.js"></script>
    <script src="src/ui/mainScreen.js"></script>
    <script src="src/ui/settingsScreen.js"></script>
    <script src="src/ui/prayerScreen.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
